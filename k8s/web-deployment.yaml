apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: edusystem
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: edusystem/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          command:
            - poetry
            - run
            - gunicorn
            - config.wsgi:application
            - --bind
            - "0.0.0.0:8000"
            - --workers
            - "4"
          envFrom:
            - configMapRef:
                name: edusystem-config
            - secretRef:
                name: edusystem-secret
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
